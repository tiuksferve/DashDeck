[[menu]]
id = "system"
label = "Sistema"
icon = "settings"
type = "provider"
provider = "system"

# Dock: comandos fixos na parte de baixo da tela (até 6). Aceita os mesmos tipos de item do menu.
# Aparece nas telas de dock_screens ([dashd]); nas outras o espaço fica para o conteúdo.
[[dock]]
id = "home"
label = "Início"
icon = "home"
img = "emoji:🏠"
type = "home"

[[dock]]
id = "relogio"
label = "Relógio"
icon = "bell"
img = "emoji:⏰"
type = "provider"
provider = "clock"
# Ecrã inteiro com a hora e a previsão do dia. Swipe para os lados troca o mostrador,
# para cima/baixo muda o brilho, um toque volta ao DashDeck (o mostrador e o brilho ficam guardados).
face = "paisagem"         # mostrador inicial: "paisagem", "retro" ou "previsao"
lcd_color = "ambar"       # cor do digital retro: "ambar", "verde" ou "ciano"
brightness = 50           # brilho inicial no relógio (o normal volta ao sair)
dim_after = 300           # segundos sem toques até escurecer (0 = nunca); um toque repõe o brilho
dim_brightness = 10       # brilho quando escurecido (%)
weather = true            # previsão do Open-Meteo (sem chave), a cada 30 min, com cache offline
# Posição da previsão: GPS (ou nó Meshtastic). Para uma posição fixa, descomente:
# lat = 38.72
# lon = -9.14
# As coordenadas saem do uConsole arredondadas a 0,01° (~1 km).

[[dock]]
id = "shot"
label = "Captura"
icon = "image"
img = "emoji:📸"
type = "shell"
cmd = "grim \"$HOME/Pictures/captura-$(date +%Y%m%d-%H%M%S).png\""
done = "Captura em ~/Pictures"

[[dock]]
id = "bright"
label = "Brilho"
icon = "charge"
img = "emoji:🔆"
type = "backlight"
levels = [25, 50, 75, 100]

[[dock]]
id = "console"
label = "Som"
icon = "audio"
img = "emoji:🔊"
type = "provider"
provider = "console"
# Volume (PipeWire) e brilho do ecrã do uConsole. O "Brilho" ao lado é o do DashDeck.
volume_step = 5           # % por toque
volume_max = 100          # limite do Vol +
# backlight = "/sys/class/backlight/backlight@0"   # por omissão, o primeiro que existir

[[dock]]
id = "lock"
label = "Bloquear"
icon = "eye"
img = "emoji:🔒"
# o mesmo que Ctrl+Alt+L no labwc (/etc/xdg/labwc/rc.xml); o loginctl lock-session não tem quem o ouça
type = "launch"
cmd = "swaylock -p"
