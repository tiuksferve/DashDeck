# Configuração do dashd: o menu do DashDeck (ESP32-C6, USB) e do Deck³ (ESP32-S3, Wi-Fi), servidos pelo
# mesmo serviço. Edite e reinicie (systemctl --user restart dashd). Não é preciso regravar os aparelhos.
#
# devices = ["deck3"] ou ["dashdeck"] num item: só aparece nesse ecrã (sem devices, aparece nos dois).
# O Deck³ não tem dock: os itens do dock (menos Início e Brilho) aparecem no fim do menu dele.
#
# Tipos de item:
#   submenu  — abre outro menu (items = [...])
#   launch   — abre uma aplicação no uConsole (cmd)
#   shell    — executa um comando em segundo plano e mostra um aviso (cmd, done)
#   service  — liga/para/reinicia uma unidade systemd (unit, group opcional)
#              Serviços com o mesmo "group" são exclusivos: ligar um pára os outros (ex.: um só SDR).
#   provider — tela com dados ao vivo (provider = system | gps | adsb | ais | mesh | clock | aio | sdr | net | console | windows | camera | stocks)
#   text     — tela de texto fixo
#   home     — volta ao menu inicial
#   backlight — alterna o brilho (levels = [25, 50, 75, 100])
# img: imagem no lugar do ícone — "emoji:✈", um nome do tema de ícones ou um caminho .png/.svg
# Ícones: home settings wifi gps play stop list bell power refresh eye charge battery usb bluetooth
#         sd folder file mail audio video image warning bars keyboard call upload download loop edit ...

[dashd]
port = "/dev/esp-dash"
title = "DashDeck"
refresh = 2.0       # segundos entre atualizações da tela aberta
backlight = 75      # 0..100 (de preferência um dos níveis do botão Brilho)
layout = "grid"     # menus em boxes; "cards" = lista com cartões (cada submenu aceita layout = ...)
rotation = 1        # 0 = retrato, 1 = horizontal, 3 = horizontal invertido, 2 = retrato invertido
screen_off = 180    # apaga o ecrã após N s sem toques na tela inicial (0 = nunca); um toque liga
dock_screens = ["home", "apps"]   # telas com o dock (ids; "home" = tela inicial)
# serial = false     # sem o DashDeck (só o Deck³)

# Deck³: o cubo por Wi-Fi (WebSocket com token em ~/.config/deck3/token, gravado no aparelho pelo
# setup/deck3/provision.py). Sem esta secção, ou com enabled = false, o dashd só serve o DashDeck.
[deckd]
enabled = true
port = 8765          # WebSocket + firmware OTA; anunciado por mDNS como _deck3._tcp
title = "Deck³"
refresh = 2.0
backlight = 80       # 0..100 (o aparelho guarda o último brilho escolhido)
bl_levels = [20, 50, 80, 100]
dim = 60             # escurece após N s sem toques (AMOLED: evita marcas); 0 = nunca
off = 300            # apaga após N s; um toque, um botão ou agitar o cubo acorda

# Botões do Deck³: <botão>_<gesto> = ação
#   botões: boot (BOOT), user (IO18), pwr (PWR, pelo AXP2101; o toque longo de vários segundos desliga)
#   gestos: short, long, double
#   ações: back · home · bl (alterna o brilho) · open:<id do menu> · shell:<comando> · launch:<comando> · none
[keys]
boot_short = "back"
boot_long = "home"
user_short = "open:config"
user_double = "shell:grim ~/Pictures/deck3-$(date +%Y%m%d-%H%M%S).png"
pwr_short = "bl"

# Créditos da cena "Sobre o Deck³" (toque no título "Deck³" da tela inicial)
[about]
lines = ["O DashDeck elevado ao cubo", "ESP-IDF · LVGL · voxels"]

[[menu]]
id = "config"
label = "Config"
img = "emoji:🎛️"
type = "provider"
provider = "config"
devices = ["deck3"]
battery_mah = 1000   # capacidade da bateria ligada ao Deck³ (para as estimativas)
# Páginas: ecrã e som (brilho, volume, escurecer/apagar) · bateria (gráfico e estimativa) · Wi-Fi ·
# Bluetooth · aparelho (estado, testes, reiniciar) · sensores (microfone, IMU)

[[menu]]
id = "aio"
label = "AIO"
icon = "power"
img = "board.svg"   # placa eletrónica (host/icons/board.svg)
color = "#3FB950"
type = "provider"
provider = "aio"
# Interruptores da placa AIO v2 (GPS, LoRa, SDR, USB) pelo aiov2_ctl. Tocar liga; desligar pede
# confirmação. Desligar o LoRa pára o meshtasticd (como na aplicação).
# cmd = "/usr/local/bin/aiov2_ctl"
# Perfis (box "Perfis"): um toque põe os recursos (on/off: GPS LORA SDR USB) e os serviços
# (start/stop: unidades systemd) como no perfil; pede confirmação com o que vai mudar.
# O perfil que já corresponde ao estado atual aparece como "Ativo". Sem perfis aqui, usa estes mesmos.

  [[menu.profiles]]
  id = "mesh"
  label = "Meshtastic"
  img = "emoji:📶"
  on = ["GPS", "LORA"]
  off = ["SDR"]
  stop = ["readsb", "ais-catcher"]

  [[menu.profiles]]
  id = "adsb"
  label = "ADS-B"
  img = "emoji:✈"
  on = ["GPS", "SDR"]
  start = ["readsb"]          # do grupo "sdr": pára o ais-catcher

  [[menu.profiles]]
  id = "ais"
  label = "AIS"
  img = "emoji:🚢"
  on = ["GPS", "SDR"]
  start = ["ais-catcher"]

  [[menu.profiles]]
  id = "eco"
  label = "Poupança"
  img = "emoji:🔋"
  off = ["GPS", "LORA", "SDR", "USB"]
  stop = ["readsb", "ais-catcher"]

[[menu]]
id = "mesh"
label = "Meshtastic"
icon = "mail"
color = "#67EA94"
type = "provider"
provider = "mesh"
# Dados pela API local do MeshDeckWeb (127.0.0.1:8080): a API do meshtasticd só aceita um cliente.
# Páginas (swipe): Painel · Nós · Conversas (toque abre a conversa; Responder na mensagem) · Mapa. Não lidas = selo vermelho.
channel = 0                       # canal inicial das respostas rápidas (troca-se na tela)
quick = ["OK", "A caminho", "Cheguei", "Preciso de ajuda", "Posição: {pos}"]
start_cmd = "cd $HOME/PycharmProjects/MeshDeckWeb && nohup ./start.sh --connect >> $HOME/.config/meshdeck/server.log 2>&1 &"

[[menu]]
id = "gps"
label = "GPS"
icon = "gps"
color = "#3FB950"
type = "provider"
provider = "gps"
# Se o meshtasticd usar o GPS (GPS.SerialPath no config.yaml), a posição vem do Meshtastic;
# senão o dashd lê NMEA direto deste tty.
tty = "/dev/ttyAMA0"
baud = 9600

[[menu]]
id = "adsb"
label = "ADS-B"
icon = "eye"
img = "emoji:✈"   # imagem colorida no lugar do símbolo
color = "#58A6FF"
type = "provider"
provider = "adsb"
unit = "readsb"
group = "sdr"
# Página "Mapa" (swipe): tiles em cache em ~/.cache/dashd/tiles (funciona offline depois de vistos).
# map_style: "simples" (Esri Dark Gray, pouco detalhe), "satelite" (Esri + nomes) ou "osm" (OSM escurecido).
# map = false desliga o fundo; map_url = "https://.../{z}/{x}/{y}.png" usa outro servidor.
map_style = "simples"
track_minutes = 30                 # trajeto guardado de cada aeronave (o AIS usa o do AIS-catcher)
squawk_alert = true                # cartão "Monitor de emergências" (avisa em qualquer tela com 7500/7600/7700)
routes = true                      # origem e destino pelo indicativo no adsbdb.com/hexdb.io (só o indicativo sai do uConsole)

[[menu]]
id = "ais"
label = "AIS"
icon = "loop"
img = "emoji:🚢"   # imagem colorida no lugar do símbolo
color = "#39C5CF"
type = "provider"
provider = "ais"
unit = "ais-catcher"
group = "sdr"
url = "http://127.0.0.1:8119"      # servidor web do serviço ais-catcher (navios e trajetos)
map_style = "simples"

[[menu]]
id = "sonde"
label = "Sondas"
icon = "upload"
img = "emoji:🎈"
color = "#58A6FF"
type = "provider"
provider = "sonde"
unit = "dashd-sonde"               # serviço --user com o receptor sem janela (host/sonderx.py)
group = "sdr"                      # partilha o SDR com o readsb e o ais-catcher (pára-os ao ligar)
gain = 40                          # dB (0 = automático)
ppm = 0
idle_stop = 1800                   # s sem pacotes, depois de um voo, até o receptor sair e libertar o SDR
# decoder = "~/PycharmProjects/SondeDeck/decoders/rs1729/demod/mod/rs41mod"   # (é o de omissão)
# Radiossondas RS41 (balões meteorológicos). Páginas (swipe): Controlo (escolher a frequência liga o
# receptor) · Mapa (trajeto, lançamento, rebentamento, pouso previsto) · Dados · Altitude · Estatísticas.
# Frequências: RS41 ouvidas no SondeHub nas estações europeias em novembro de 2026 (podem mudar).
# As estações francesas, Barcelona e Múrcia lançam M10/M20, que o rs41mod não descodifica.
freqs = [
  { mhz = 403.40, name = "Lisboa (Portela)" },
  { mhz = 402.50, name = "Sevilha (Morón)" },
  { mhz = 403.00, name = "Madrid (Barajas) · Jokioinen" },
  { mhz = 404.00, name = "Corunha · Viena · Liubliana" },
  { mhz = 401.50, name = "Santander" },
  { mhz = 403.75, name = "Funchal (Madeira)" },
  { mhz = 402.00, name = "Lajes (Açores)" },
  { mhz = 401.00, name = "Valentia (Irlanda)" },
  { mhz = 405.70, name = "Camborne (Reino Unido)" },
  { mhz = 405.80, name = "Herstmonceux (Reino Unido)" },
  { mhz = 403.10, name = "Lerwick (Reino Unido)" },
  { mhz = 403.50, name = "Payerne (Suíça) · Uccle (Bélgica)" },
  { mhz = 403.90, name = "De Bilt (Países Baixos) · Essen" },
  { mhz = 405.30, name = "Essen · Zagreb" },
  { mhz = 405.10, name = "Lindenberg (Alemanha)" },
  { mhz = 404.20, name = "Praga" },
  { mhz = 404.50, name = "Legionowo (Polónia)" },
  { mhz = 403.70, name = "Budapeste" },
]

[[menu]]
id = "sdr"
label = "SDR"
icon = "eye"
img = "emoji:📻"
color = "#D29922"
type = "provider"
provider = "sdr"
# Monitor do RTL-SDR: alimentação na AIO, dongle, quem o usa, frequência, há quanto tempo e o histórico.
# "Libertar SDR" pára o serviço (ou fecha o programa) que o tem aberto.

[[menu]]
id = "camera"
label = "Câmara"
icon = "image"
img = "emoji:📷"
color = "#F778BA"
type = "provider"
provider = "camera"
url = "http://127.0.0.1:8090"      # camd do CamDeck (entra com o token de ~/.config/camdeck/local-token)
quality = 70                       # qualidade JPEG do visor (mais baixa = mais quadros por segundo)
# Páginas (swipe): Visor (vídeo ao vivo; Foto e Gravar por cima da imagem) · Galeria (fotos e vídeos
# um a um; os vídeos tocam no ecrã, sem som; Apagar com confirmação) · Estado (sensor, fps,
# temperatura, gravação, disco; botões para a resolução do vídeo e das fotos e Abrir no uConsole).

[[menu]]
id = "stocks"
label = "Stocks"
icon = "bars"
img = "emoji:📈"
color = "#3FB950"
type = "provider"
provider = "stocks"
refresh = 60                       # s entre atualizações com a tela aberta (5 min só com o box do menu)
# Cotações do Yahoo Finance (só o símbolo sai do uConsole). Cada box: logotipo, nome, cotação e a
# variação do dia (verde a subir, vermelho a descer). Toque: gráfico do dia e valores.
# Os logotipos são descarregados uma vez para ~/.cache/dashd/logos (não vão para o repositório).
symbols = [
  { sym = "SIE.DE", name = "Siemens" },
  { sym = "TSLA", name = "Tesla" },
  { sym = "SPCX", name = "SpaceX", logo_crop = 0.65 },   # só o X com a curva (o logotipo é muito largo)
  { sym = "AAPL", name = "Apple" },
  { sym = "NVDA", name = "NVIDIA" },
]

[[menu]]
id = "net"
label = "Rede"
icon = "wifi"
color = "#58A6FF"
type = "provider"
provider = "net"
# Pelo NetworkManager. Páginas (swipe): Wi-Fi (estado, Procurar, ligar/desligar o Wi-Fi) ·
# Redes (as guardadas e as abertas ligam-se com um toque; uma rede nova com palavra-passe liga-se
# uma vez no uConsole) · VPN (ligações VPN/WireGuard do NetworkManager e o Tailscale, se existir).

[[menu]]
id = "shares"
label = "Partilhas"
img = "emoji:📂"
color = "#3FB950"
type = "provider"
provider = "shares"
# Pastas do home partilhadas pela rede Wi-Fi (Samba; configuração em /etc/samba/smb.conf, ver
# docs/configuracao.md). A box só mostra o estado (ponto verde/vermelho), o endereço e quantos
